name: Crawl AoE2 2v2 data

on:
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run live crawler (Relic API, top 15000 players)
        run: python3 scripts/crawl.py --count 15000

      - name: Validate output
        run: |
          MATCHES=$(python3 -c "import json; print(json.load(open('public/data/maps.json'))['total_matches'])" 2>/dev/null || echo 0)
          echo "total_matches=$MATCHES"
          if [ "$MATCHES" -lt 1000 ]; then
            echo "Too few matches ($MATCHES) — refusing to commit"
            exit 1
          fi

      - name: Commit and push updated data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/maps.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update match data [skip ci]"
            git pull --rebase origin main
            git push
          fi
