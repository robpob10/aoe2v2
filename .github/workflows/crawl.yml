name: Crawl AoE2 2v2 data

on:
  schedule:
    - cron: '0 4 * * *'   # Daily at 04:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas pyarrow

      - name: Get week key for cache
        id: date
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache aoestats Parquet downloads
        uses: actions/cache@v4
        with:
          path: .data_cache
          key: aoestats-parquet-${{ steps.date.outputs.week }}
          restore-keys: aoestats-parquet-

      - name: Fetch historical data (aoestats Parquet dumps)
        run: python3 scripts/fetch_data.py

      - name: Run live crawler (Relic API)
        run: python3 scripts/crawl.py
        continue-on-error: true

      - name: Merge historical + live data
        run: python3 scripts/merge_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/maps.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: update match data [skip ci]"
            git push
          fi
